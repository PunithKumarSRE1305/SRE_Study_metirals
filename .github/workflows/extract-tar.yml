name: Extract Tar.gz and Commit

on:
  push:
    paths:
      - '**.tar.gz'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Find and extract tar.gz files
        run: |
          echo "Searching for tar.gz files..."
          for file in $(find . -name "*.tar.gz" -type f); do
            echo "Found and extracting: $file"
            dirname=$(dirname "$file")
            tar -xzf "$file" -C "$dirname" || echo "Failed to extract $file"
            echo "✅ Extracted $file to $dirname"
          done
          echo "Listing extracted files:"
          find . -type f -newer . | head -20
      
      - name: Check for changes
        run: |
          git status
      
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Extract tar.gz files"
            git push
            echo "✅ Committed and pushed extracted files"
          else
            echo "ℹ️ No changes to commit"
          fi
